name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  PUBLISH_LATEST: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: |
            APP_VERSION=${{ env.RELEASE_TAG }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/maelremrem/babycare:${{ env.RELEASE_TAG }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=runtime-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.architecture }}

      - name: Build and publish updater architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: updater
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/maelremrem/babycare-updater:${{ env.RELEASE_TAG }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=updater-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=updater-${{ matrix.architecture }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          major="${version%%.*}"

          runtime_tags=(
            --tag "ghcr.io/maelremrem/babycare:${version}"
            --tag "ghcr.io/maelremrem/babycare:${minor}"
            --tag "ghcr.io/maelremrem/babycare:${major}"
          )
          updater_tags=(
            --tag "ghcr.io/maelremrem/babycare-updater:${version}"
            --tag "ghcr.io/maelremrem/babycare-updater:${minor}"
          )
          if [ "${PUBLISH_LATEST}" = "true" ]; then
            runtime_tags+=(--tag "ghcr.io/maelremrem/babycare:latest")
            updater_tags+=(--tag "ghcr.io/maelremrem/babycare-updater:latest")
          fi

          docker buildx imagetools create "${runtime_tags[@]}" \
            "ghcr.io/maelremrem/babycare:${RELEASE_TAG}-amd64" \
            "ghcr.io/maelremrem/babycare:${RELEASE_TAG}-arm64"
          docker buildx imagetools create "${updater_tags[@]}" \
            "ghcr.io/maelremrem/babycare-updater:${RELEASE_TAG}-amd64" \
            "ghcr.io/maelremrem/babycare-updater:${RELEASE_TAG}-arm64"
