name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  PUBLISH_LATEST: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/maelremrem/babycare
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ env.PUBLISH_LATEST }}

      - name: Extract updater image metadata
        id: updater-metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/maelremrem/babycare-updater
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ env.PUBLISH_LATEST }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: |
            APP_VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish updater
        uses: docker/build-push-action@v6
        with:
          context: .
          target: updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.updater-metadata.outputs.tags }}
          labels: ${{ steps.updater-metadata.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
