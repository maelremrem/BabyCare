name: Tag version bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag when package version changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          git fetch --tags --force

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be MAJOR.MINOR.PATCH: ${version}" >&2
            exit 1
          fi

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi

          latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [ -n "${latest}" ] && [ "${tag}" = "${latest}" ]; then
            echo "Version ${version} is already the latest release; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" --message "BabyCare ${tag}"
          git push origin "${tag}"
          gh workflow run release.yml --ref "${tag}"
          echo "Created ${tag}; the release workflow will publish the distribution."
